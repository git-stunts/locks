name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unicode-without-en-us:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install test prerequisites
        run: |
          apt-get update
          apt-get install -y ca-certificates git python3-jsonschema
      - uses: actions/checkout@v4
      - name: Confirm the image has C.utf8 but no en_US UTF-8 locale
        shell: bash
        run: |
          set -euo pipefail
          found_c=0
          found_en_us=0
          while IFS= read -r installed; do
            printf '%s\n' "$installed"
            case "${installed,,}" in
              c.utf8 | c.utf-8) found_c=1 ;;
              en_us.utf8 | en_us.utf-8) found_en_us=1 ;;
            esac
          done < <(locale -a)
          [[ "$found_c" == 1 ]]
          [[ "$found_en_us" == 0 ]]
      - name: Reproduce the old merged-stream contamination
        shell: bash
        run: |
          set -euo pipefail
          probe="$(mktemp -d)"
          mkdir -p "$probe/home" "$probe/work"
          git -C "$probe/work" init -q -b main
          export HOME="$probe/home"
          export GIT_LOCKS_STORE="$probe/store.git"
          merged="$(cd "$probe/work" && LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8 "$GITHUB_WORKSPACE/bin/git-locks" claim --job unicode-red --holder 'héloïse' 'café/naïve.md' 2>&1)"
          [[ "$merged" == *setlocale* ]]
          [[ "$merged" == *'"event":"claimed"'* ]]
          if python3 -c 'import json, sys; [json.loads(line) for line in sys.stdin if line.strip()]' <<<"$merged"; then
            echo 'expected the merged warning and JSON stream to fail JSON parsing' >&2
            exit 1
          fi
      - name: Test Unicode output under the installed UTF-8 locale
        shell: bash
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          bash test/unicode-locale.sh
          no_locale_output="$(GIT_LOCKS_TEST_LOCALES=$'C\nPOSIX' bash test/unicode-locale.sh)"
          printf '%s\n' "$no_locale_output"
          [[ "$no_locale_output" == *'SKIP Unicode claim/list/check integration'* ]]

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck and shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-jsonschema
          go install mvdan.cc/sh/v3/cmd/shfmt@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: make lint
      - name: Test
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          make test

  release:
    needs: [lint-and-test, unicode-without-en-us]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and release when VERSION has no tag yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n "s/^VERSION='\(.*\)'$/\1/p" bin/git-locks)" # the built script; lib/000-prelude.sh is the source
          [ -n "$version" ] || { echo "no VERSION in bin/git-locks"; exit 1; }
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null 2>&1 || gh release view "$tag" >/dev/null 2>&1; then
            echo "${tag} already exists; nothing to release"
            exit 0
          fi
          notes="$(awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {if (f) exit} f' CHANGELOG.md)"
          [ -n "$notes" ] || { echo "CHANGELOG.md has no section for ${version}"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "git-locks ${version}"
          git push origin "$tag"
          gh release create "$tag" --title "git-locks ${tag}" --notes "$notes" bin/git-locks schema/git-locks.schema.json
